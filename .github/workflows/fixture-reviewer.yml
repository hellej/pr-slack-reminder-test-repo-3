# Submits fixture reviews as github-actions[bot].
# Each line of reviews.txt: <pr-number> <approve|request-changes> <body...>
name: fixture-reviewer
on:
  push:
    branches: [reviewer-bot]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while read -r pr action body; do
            [ -z "$pr" ] && continue
            echo "PR #$pr: $action"
            gh pr review "$pr" "--$action" --body "$body"
          done < reviews.txt
